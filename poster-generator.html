<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ART 3041 — Parametric Poster Engine (Session 2)</title>

  <!-- Google Web Fonts for Cross-Platform PC/Mac Vector Rendering -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;700;900&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Pirata+One&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. DESIGN SYSTEM & WORKSPACE CSS
       Theme: Blackberry Black (#0B0912), Moonlight Silver (#D8DCE6), Dark Pink (#C23A80)
       Geometry: Strict 0px border-radius everywhere
       ========================================================================== */
    :root {
      --bg-black: #0B0912;
      --silver: #D8DCE6;
      --dark-pink: #C23A80;
      --dark-pink-glow: rgba(194, 58, 128, 0.3);
      --font-gothic: 'UnifrakturCook', cursive;
      --font-display: 'Pirata One', cursive;
      --font-roman: 'Cinzel', serif;
      --font-roman-dec: 'Cinzel Decorative', serif;
      --font-editorial: 'Libre Caslon Text', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0px !important;
    }

    body {
      background-color: var(--bg-black);
      color: var(--silver);
      font-family: var(--font-roman-dec);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Fixed background starfield canvas */
    #starfield-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* Top application bar */
    header {
      position: relative;
      z-index: 10;
      padding: 16px 28px;
      border-bottom: 2px solid var(--dark-pink);
      background: rgba(11, 9, 18, 0.95);
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
    }

    .brand-title {
      font-family: var(--font-gothic);
      font-size: 1.85rem;
      color: var(--silver);
      letter-spacing: 1px;
    }

    .brand-subtitle {
      font-family: var(--font-roman-dec);
      font-size: 0.72rem;
      color: var(--dark-pink);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Studio two-column split layout */
    .studio-workspace {
      position: relative;
      z-index: 5;
      display: flex;
      flex: 1;
      height: calc(100vh - 73px);
    }

    /* Left Control Deck */
    .control-deck {
      width: 440px;
      min-width: 400px;
      background: rgba(11, 9, 18, 0.96);
      border-right: 2px solid var(--dark-pink);
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Right Viewport Panel */
    .viewport-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at center, rgba(194, 58, 128, 0.06) 0%, rgba(11, 9, 18, 0.85) 100%);
      overflow: auto;
    }

    /* Control Groups */
    .control-group {
      border: 2px solid var(--dark-pink);
      padding: 16px;
      background: rgba(11, 9, 18, 0.65);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .group-label {
      font-family: var(--font-gothic);
      font-size: 1.25rem;
      color: var(--silver);
      border-bottom: 1px solid var(--dark-pink);
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .field-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.7rem;
      letter-spacing: 1px;
      color: var(--silver);
      text-transform: uppercase;
    }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      background: #000000;
      border: 1px solid var(--dark-pink);
      color: var(--silver);
      padding: 8px 10px;
      font-family: var(--font-roman);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 200ms ease;
    }

    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      border-color: var(--silver);
      box-shadow: 0 0 8px var(--dark-pink-glow);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      background: #000;
      height: 6px;
      border: 1px solid var(--dark-pink);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: var(--dark-pink);
      cursor: pointer;
      border: 1px solid var(--silver);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    /* Design System Buttons */
    .action-btn {
      display: inline-block;
      width: 100%;
      text-align: center;
      background: transparent;
      color: var(--dark-pink);
      border: 2px solid var(--dark-pink);
      padding: 12px 16px;
      font-family: var(--font-roman-dec);
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      text-decoration: none;
      transition: all 200ms ease;
      text-transform: uppercase;
    }

    .action-btn:hover {
      background: var(--dark-pink);
      color: var(--silver);
      box-shadow: 0 0 14px var(--dark-pink-glow);
    }

    .action-btn.secondary {
      border-color: var(--silver);
      color: var(--silver);
    }

    .action-btn.secondary:hover {
      background: var(--silver);
      color: var(--bg-black);
    }

    /* Live Poster SVG Canvas Box */
    .poster-frame {
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.95), 0 0 1px 2px var(--dark-pink);
      max-height: 88vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #poster-svg {
      width: 540px;
      height: 720px;
      display: block;
    }

    @media (max-width: 900px) {
      .studio-workspace {
        flex-direction: column;
        height: auto;
      }
      .control-deck {
        width: 100%;
        min-width: 100%;
        border-right: none;
        border-bottom: 2px solid var(--dark-pink);
      }
      #poster-svg {
        width: 100%;
        max-width: 420px;
        height: auto;
        aspect-ratio: 3/4;
      }
    }
  </style>
</head>
<body>

  <!-- Continuous Drifting Background Canvas -->
  <canvas id="starfield-canvas"></canvas>

  <!-- Application Navigation Header -->
  <header>
    <div>
      <div class="brand-title">ART 3041 · Poster Generator</div>
      <div class="brand-subtitle">Session 2 · Programmatic Web Engine</div>
    </div>
    <div style="font-size: 0.75rem; color: var(--silver); letter-spacing: 1px;">
      ALIOU DIALLO · FALL 2026
    </div>
  </header>

  <!-- Main Split Studio Workspace -->
  <div class="studio-workspace">

    <!-- Left Controls Panel -->
    <aside class="control-deck">

      <!-- Action Panel -->
      <div class="control-group" style="border-color: var(--silver);">
        <button id="btn-export-svg" class="action-btn">Export Illustrator SVG</button>
        <button id="btn-mutate" class="action-btn secondary" style="margin-top: 8px;">Mutate Permutation</button>
      </div>

      <!-- Color Atmosphere Selector -->
      <div class="control-group">
        <div class="group-label">
          <span>Palette & Atmosphere</span>
          <span style="font-size: 0.7rem; color: var(--dark-pink);">CANON</span>
        </div>

        <div class="field-row">
          <label for="palette-preset">Archival Color Mode</label>
          <select id="palette-preset">
            <option value="class-palette" selected>Class Palette (Blackberry / Dark Pink / Silver)</option>
            <option value="aged-parchment">Aged Parchment & Ink (#D6CEBD / #181513)</option>
            <option value="bone-silver">Bone White & Oxidized Silver (#EAE6DF / #2E3339)</option>
            <option value="burgundy-relic">Dried Blood Burgundy & Gold (#380E18 / #C9A96E)</option>
            <option value="plum-esoteric">Muted Plum & Starlight (#1A101C / #D8DCE6)</option>
          </select>
        </div>
      </div>

      <!-- Central Illustration Plate -->
      <div class="control-group">
        <div class="group-label">
          <span>Central Illustration</span>
          <span style="font-size: 0.7rem; color: var(--dark-pink);">LEVEL 1</span>
        </div>

        <div class="field-row">
          <label for="plate-select">Archival Plate Asset</label>
          <select id="plate-select">
            <option value="embedded-archival" selected>Embedded Archival Specimen (Standalone Fallback)</option>
            <option value="poster/dore 3.webp">Gustave Doré — The Chasm (Plate III)</option>
            <option value="poster/dore 2.webp">Gustave Doré — Celestial Choir (Plate II)</option>
            <option value="poster/dore 4.webp">Gustave Doré — Angelic Ascent (Plate IV)</option>
            <option value="poster/booth 1.jpeg">Franklin Booth — Monolithic Horizon I</option>
            <option value="poster/booth 2.jpg">Franklin Booth — Archival Forest II</option>
            <option value="poster/dulac 1.jpg">Edmund Dulac — Occult Specimen</option>
          </select>
        </div>

        <div class="field-row">
          <label for="plate-upload">Choose or Drop Any Local Image</label>
          <input type="file" id="plate-upload" accept="image/*" style="font-size: 0.7rem; color: var(--silver);">
        </div>

        <div class="field-row">
          <label for="plate-filter">Tonal Print Chemistry</label>
          <select id="plate-filter">
            <option value="duotone" selected>Duotone Blend (Dark Pink / Black)</option>
            <option value="high-contrast">High-Contrast Woodcut Engraving</option>
            <option value="solarize">Esoteric Negative Solarization</option>
            <option value="relic">Oxidized Relic (Low Gamma)</option>
            <option value="raw">Raw Unfiltered Plate</option>
          </select>
        </div>

        <div class="field-row">
          <label for="plate-scale">Illustration Scale (35%–60%): <span id="val-plate-scale">50%</span></label>
          <input type="range" id="plate-scale" min="35" max="65" value="50">
        </div>
      </div>

      <!-- Monumental Title (Behind Artwork) -->
      <div class="control-group">
        <div class="group-label">
          <span>Monumental Title</span>
          <span style="font-size: 0.7rem; color: var(--dark-pink);">LEVEL 2</span>
        </div>

        <div class="field-row">
          <label for="text-h1">Primary Inscription</label>
          <input type="text" id="text-h1" value="CHTHONIC RITUAL">
        </div>

        <div class="field-row">
          <label for="font-h1">Monumental Typeface</label>
          <select id="font-h1">
            <option value="UnifrakturCook" selected>UnifrakturCook (Fraktur Gothic)</option>
            <option value="Pirata One">Pirata One (Gothic Display)</option>
            <option value="Cinzel">Cinzel (Imperial Roman)</option>
            <option value="Libre Caslon Text">Libre Caslon (Classical Serif)</option>
          </select>
        </div>

        <div class="field-row">
          <label for="size-h1">Type Scale (px): <span id="val-size-h1">84</span></label>
          <input type="range" id="size-h1" min="48" max="130" value="84">
        </div>

        <div class="field-row">
          <label for="y-h1">Vertical Horizon: <span id="val-y-h1">38%</span></label>
          <input type="range" id="y-h1" min="15" max="85" value="38">
        </div>

        <div class="toggle-row">
          <label for="toggle-behind">Interlace Title Behind Plate</label>
          <input type="checkbox" id="toggle-behind" checked>
        </div>
      </div>

      <!-- Secondary Hierarchy & Supporting Information -->
      <div class="control-group">
        <div class="group-label">
          <span>Information & Occult Lore</span>
          <span style="font-size: 0.7rem; color: var(--dark-pink);">LEVEL 3</span>
        </div>

        <div class="field-row">
          <label for="text-h2">Architectural Sub-Header (H2)</label>
          <input type="text" id="text-h2" value="OPUS MATHEMATICA · FASCICLE IX">
        </div>

        <div class="field-row">
          <label for="text-meta">Information Group (Date / Venue / Catalog)</label>
          <textarea id="text-meta" rows="3">EQUINOX TRANSMISSION · 2026.09.30
LOCUS: 40°42'46"N 74°00'22"W · CRYPT III
CONCLAVE OF EXPERIMENTAL SOUND · ACT I</textarea>
        </div>

        <div class="field-row">
          <label for="font-body">Information Typeface</label>
          <select id="font-body">
            <option value="Cinzel" selected>Cinzel (Architectural Serif)</option>
            <option value="Libre Caslon Text">Libre Caslon (Scholarly Book)</option>
          </select>
        </div>
      </div>

      <!-- Grid, Alchemical Sigils & Esoteric Geometry -->
      <div class="control-group">
        <div class="group-label">
          <span>Alchemical & Grid Systems</span>
          <span style="font-size: 0.7rem; color: var(--dark-pink);">GEOMETRY</span>
        </div>

        <div class="field-row">
          <label for="grid-cols">Mathematical Grid System</label>
          <select id="grid-cols">
            <option value="12">12-Column Swiss Mathematical</option>
            <option value="6">6-Column Asymmetric</option>
            <option value="3">3-Column Triptych</option>
            <option value="none">Zero Guide Grid (Void)</option>
          </select>
        </div>

        <div class="toggle-row">
          <label for="toggle-grid-lines">Render Hairline Guides</label>
          <input type="checkbox" id="toggle-grid-lines" checked>
        </div>

        <div class="toggle-row">
          <label for="toggle-celestial">Alchemical Planetary Seal</label>
          <input type="checkbox" id="toggle-celestial" checked>
        </div>

        <div class="toggle-row">
          <label for="toggle-brackets">Artifact Registration Brackets</label>
          <input type="checkbox" id="toggle-brackets" checked>
        </div>
      </div>

    </aside>

    <!-- Right Live SVG Viewport -->
    <main class="viewport-panel">
      <div class="poster-frame">
        <!-- Pure Vector SVG Output Engine -->
        <svg id="poster-svg" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Embedded Fonts for Illustrator Standalone Compatibility -->
            <style>
              @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&amp;family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&amp;family=Pirata+One&amp;family=UnifrakturCook:wght@700&amp;display=swap');

              .svg-h1 {
                text-anchor: middle;
                letter-spacing: 3px;
              }
              .svg-h2 {
                font-family: 'Cinzel', serif;
                font-size: 16px;
                letter-spacing: 6px;
                text-anchor: middle;
              }
              .svg-meta {
                font-size: 11px;
                letter-spacing: 2px;
                line-height: 1.6;
              }
              .hairline-grid {
                stroke-width: 1px;
                stroke-dasharray: 2 4;
              }
              .solid-rule {
                stroke-width: 1.5px;
              }
            </style>

            <!-- Tonal Filter Definitions for Plates -->
            <filter id="duotone-filter" color-interpolation-filters="sRGB">
              <feColorMatrix type="matrix" values="
                0.33 0.33 0.33 0 0
                0.33 0.33 0.33 0 0
                0.33 0.33 0.33 0 0
                0    0    0    1 0" />
              <feComponentTransfer>
                <feFuncR type="table" tableValues="0.043 0.76 0.84" />
                <feFuncG type="table" tableValues="0.035 0.22 0.86" />
                <feFuncB type="table" tableValues="0.070 0.50 0.90" />
              </feComponentTransfer>
            </filter>

            <filter id="high-contrast-filter">
              <feColorMatrix type="matrix" values="
                1.8 0   0   0 -0.3
                0   1.8 0   0 -0.3
                0   0   1.8 0 -0.3
                0   0   0   1 0" />
            </filter>

            <filter id="solarize-filter">
              <feComponentTransfer>
                <feFuncR type="table" tableValues="0.9 0.2 0.7 0" />
                <feFuncG type="table" tableValues="0.7 0 0.3 0.1" />
                <feFuncB type="table" tableValues="0.8 0.3 0.5 0.2" />
              </feComponentTransfer>
            </filter>

            <filter id="relic-filter">
              <feColorMatrix type="matrix" values="
                0.393 0.769 0.189 0 -0.15
                0.349 0.686 0.168 0 -0.15
                0.272 0.534 0.131 0 -0.15
                0     0     0     1 0" />
            </filter>
          </defs>

          <!-- Layer 0: Background Substrate -->
          <rect id="svg-bg" width="900" height="1200" fill="#0B0912" />

          <!-- Layer 1: Mathematical Grid System -->
          <g id="svg-grid-layer"></g>

          <!-- Layer 2: Celestial Alchemical Seal Diagram -->
          <g id="svg-celestial-layer"></g>

          <!-- Layer 3: Title Behind Artwork Layer (Interlaced) -->
          <g id="svg-behind-title-layer"></g>

          <!-- Layer 4: Dominant Illustration Plate -->
          <g id="svg-artwork-layer"></g>

          <!-- Layer 5: Title Fore Artwork Layer (Fallback) -->
          <g id="svg-fore-title-layer"></g>

          <!-- Layer 6: Secondary Metadata & Occult Lore -->
          <g id="svg-metadata-layer"></g>

          <!-- Layer 7: Frame Rules & Artifact Brackets -->
          <g id="svg-frame-layer"></g>
        </svg>
      </div>
    </main>

  </div>

  <script>
    /* ==========================================================================
       2. CONTINUOUS BACKGROUND STAR DRIFT ANIMATION
       Fast-moving celestial canvas backdrop
       ========================================================================== */
    const starCanvas = document.getElementById('starfield-canvas');
    const ctx = starCanvas.getContext('2d');
    let stars = [];
    const NUM_STARS = 140;

    function resizeStarCanvas() {
      starCanvas.width = window.innerWidth;
      starCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeStarCanvas);
    resizeStarCanvas();

    for (let i = 0; i < NUM_STARS; i++) {
      stars.push({
        x: Math.random() * starCanvas.width,
        y: Math.random() * starCanvas.height,
        size: Math.random() * 2.2 + 0.8,
        speedX: (Math.random() - 0.5) * 1.8,
        speedY: -(Math.random() * 2.2 + 1.2),
        alpha: Math.random() * 0.7 + 0.3,
        twinkleRate: Math.random() * 0.03 + 0.01,
        isPink: Math.random() > 0.75
      });
    }

    function animateStars() {
      ctx.clearRect(0, 0, starCanvas.width, starCanvas.height);
      for (let s of stars) {
        s.y += s.speedY;
        s.x += s.speedX;
        s.alpha += Math.sin(Date.now() * s.twinkleRate) * 0.01;

        if (s.y < 0) s.y = starCanvas.height;
        if (s.x < 0) s.x = starCanvas.width;
        if (s.x > starCanvas.width) s.x = 0;

        ctx.fillStyle = s.isPink
          ? `rgba(194, 58, 128, ${Math.max(0.1, Math.min(1, s.alpha))})`
          : `rgba(216, 220, 230, ${Math.max(0.1, Math.min(1, s.alpha))})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      }
      requestAnimationFrame(animateStars);
    }
    animateStars();

    /* ==========================================================================
       3. PARAMETRIC ENGINE & POSTER COMPILER
       Executes SKILLS.md layer order and mathematical alignments
       ========================================================================== */
    let currentImageBase64 = null;

    // High-resolution SVG procedural woodcut engraving specimen as standalone fallback
    const DEFAULT_EMBEDDED_SPECIMEN = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800"><rect width="600" height="800" fill="%23000000"/><g stroke="%23D8DCE6" stroke-width="1.2" opacity="0.85"><circle cx="300" cy="400" r="240" fill="none" stroke-dasharray="3 6"/><circle cx="300" cy="400" r="180" fill="none"/><polygon points="300,160 508,520 92,520" fill="none" stroke-width="1.5"/><polygon points="300,640 508,280 92,280" fill="none" stroke-width="1.5"/><circle cx="300" cy="400" r="80" fill="none" stroke-width="2"/><line x1="300" y1="120" x2="300" y2="680" stroke-dasharray="2 4"/><line x1="20" y1="400" x2="580" y2="400" stroke-dasharray="2 4"/><path d="M120,400 Q300,220 480,400 Q300,580 120,400" fill="none" stroke-width="1.8"/><circle cx="300" cy="400" r="30" fill="%23C23A80" opacity="0.6"/><path d="M260,370 L340,370 L300,450 Z" fill="%23D8DCE6" opacity="0.8"/></g></svg>`;

    // DOM Controls
    const palettePreset = document.getElementById('palette-preset');
    const plateSelect = document.getElementById('plate-select');
    const plateUpload = document.getElementById('plate-upload');
    const plateFilter = document.getElementById('plate-filter');
    const plateScale = document.getElementById('plate-scale');
    const valPlateScale = document.getElementById('val-plate-scale');

    const textH1 = document.getElementById('text-h1');
    const fontH1 = document.getElementById('font-h1');
    const sizeH1 = document.getElementById('size-h1');
    const valSizeH1 = document.getElementById('val-size-h1');
    const yH1 = document.getElementById('y-h1');
    const valYH1 = document.getElementById('val-y-h1');
    const toggleBehind = document.getElementById('toggle-behind');

    const textH2 = document.getElementById('text-h2');
    const textMeta = document.getElementById('text-meta');
    const fontBody = document.getElementById('font-body');

    const gridCols = document.getElementById('grid-cols');
    const toggleGridLines = document.getElementById('toggle-grid-lines');
    const toggleCelestial = document.getElementById('toggle-celestial');
    const toggleBrackets = document.getElementById('toggle-brackets');

    const btnMutate = document.getElementById('btn-mutate');
    const btnExportSvg = document.getElementById('btn-export-svg');

    // SVG Layers
    const svgBg = document.getElementById('svg-bg');
    const gridLayer = document.getElementById('svg-grid-layer');
    const celestialLayer = document.getElementById('svg-celestial-layer');
    const behindTitleLayer = document.getElementById('svg-behind-title-layer');
    const artworkLayer = document.getElementById('svg-artwork-layer');
    const foreTitleLayer = document.getElementById('svg-fore-title-layer');
    const metadataLayer = document.getElementById('svg-metadata-layer');
    const frameLayer = document.getElementById('svg-frame-layer');

    // Palette Color Mapping
    const PALETTES = {
      'class-palette': { bg: '#0B0912', accent: '#C23A80', text: '#D8DCE6', grid: 'rgba(194, 58, 128, 0.28)' },
      'aged-parchment': { bg: '#D6CEBD', accent: '#3B1812', text: '#181513', grid: 'rgba(59, 24, 18, 0.22)' },
      'bone-silver': { bg: '#EAE6DF', accent: '#2E3339', text: '#111315', grid: 'rgba(46, 51, 57, 0.22)' },
      'burgundy-relic': { bg: '#380E18', accent: '#C9A96E', text: '#EAE2D5', grid: 'rgba(201, 169, 110, 0.25)' },
      'plum-esoteric': { bg: '#1A101C', accent: '#8F4A75', text: '#D8DCE6', grid: 'rgba(143, 74, 117, 0.3)' }
    };

    // Convert uploaded image directly into Base64 to bypass browser local path restrictions
    plateUpload.addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (evt) {
          currentImageBase64 = evt.target.result;
          renderPoster();
        };
        reader.readAsDataURL(file);
      }
    });

    plateSelect.addEventListener('change', () => {
      currentImageBase64 = null;
      renderPoster();
    });

    // Wire parameter sliders & inputs to live render
    [palettePreset, plateFilter, plateScale, textH1, fontH1, sizeH1, yH1, toggleBehind, textH2, textMeta, fontBody, gridCols, toggleGridLines, toggleCelestial, toggleBrackets]
      .forEach(el => el.addEventListener('input', updateAndRender));

    function updateAndRender() {
      valPlateScale.textContent = plateScale.value + '%';
      valSizeH1.textContent = sizeH1.value;
      valYH1.textContent = yH1.value + '%';
      renderPoster();
    }

    /**
     * Primary Render Pipeline
     */
    function renderPoster() {
      const theme = PALETTES[palettePreset.value] || PALETTES['class-palette'];

      // 0. Set Canvas Substrate Color
      svgBg.setAttribute('fill', theme.bg);

      // 1. Structural Mathematical Grid
      gridLayer.innerHTML = '';
      const cols = gridCols.value;
      const margin = 50;
      const usableW = 900 - (margin * 2);
      const usableH = 1200 - (margin * 2);

      if (cols !== 'none' && toggleGridLines.checked) {
        const numCols = parseInt(cols, 10);
        const colW = usableW / numCols;
        for (let i = 0; i <= numCols; i++) {
          const x = margin + (i * colW);
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', x);
          line.setAttribute('y1', margin);
          line.setAttribute('x2', x);
          line.setAttribute('y2', 1200 - margin);
          line.setAttribute('stroke', theme.grid);
          line.setAttribute('class', 'hairline-grid');
          gridLayer.appendChild(line);
        }

        // Horizontal Unit Divisions
        const numRows = 8;
        const rowH = usableH / numRows;
        for (let j = 0; j <= numRows; j++) {
          const y = margin + (j * rowH);
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', margin);
          line.setAttribute('y1', y);
          line.setAttribute('x2', 900 - margin);
          line.setAttribute('y2', y);
          line.setAttribute('stroke', theme.grid);
          line.setAttribute('class', 'hairline-grid');
          gridLayer.appendChild(line);
        }
      }

      // 2. Alchemical Celestial Seal
      celestialLayer.innerHTML = '';
      if (toggleCelestial.checked) {
        const seal = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        seal.setAttribute('transform', 'translate(450, 600)');
        seal.setAttribute('stroke', theme.accent);
        seal.setAttribute('fill', 'none');
        seal.setAttribute('stroke-width', '1');
        seal.innerHTML = `
          <circle r="340" stroke-dasharray="3 6" opacity="0.6"/>
          <circle r="325" opacity="0.8"/>
          <circle r="215" stroke-dasharray="1 4" opacity="0.5"/>
          <circle r="120" opacity="0.7"/>
          <polygon points="0,-325 281,162 -281,162" stroke="${theme.text}" opacity="0.25" />
          <polygon points="0,325 281,-162 -281,-162" stroke="${theme.text}" opacity="0.25" />
          <line x1="-360" y1="0" x2="360" y2="0" stroke-dasharray="2 8" opacity="0.5"/>
          <line x1="0" y1="-360" x2="0" y2="360" stroke-dasharray="2 8" opacity="0.5"/>
        `;
        celestialLayer.appendChild(seal);
      }

      // 3. Central Illustration Plate (Occupies 35% - 60% of poster)
      artworkLayer.innerHTML = '';

      // Determine image source: Base64 upload, selected relative path, or embedded fallback
      let imgHref = currentImageBase64;
      if (!imgHref) {
        if (plateSelect.value === 'embedded-archival') {
          imgHref = DEFAULT_EMBEDDED_SPECIMEN;
        } else {
          imgHref = plateSelect.value;
        }
      }

      const scaleFraction = parseInt(plateScale.value, 10) / 100;
      const imgW = 760 * scaleFraction;
      const imgH = 920 * scaleFraction;
      const imgX = (900 - imgW) / 2;
      const imgY = 160 + (680 - imgH) / 2;

      let filterAttr = '';
      if (plateFilter.value === 'duotone') filterAttr = 'url(#duotone-filter)';
      else if (plateFilter.value === 'high-contrast') filterAttr = 'url(#high-contrast-filter)';
      else if (plateFilter.value === 'solarize') filterAttr = 'url(#solarize-filter)';
      else if (plateFilter.value === 'relic') filterAttr = 'url(#relic-filter)';

      const svgImg = document.createElementNS('http://www.w3.org/2000/svg', 'image');
      svgImg.setAttribute('href', imgHref);
      svgImg.setAttribute('x', imgX);
      svgImg.setAttribute('y', imgY);
      svgImg.setAttribute('width', imgW);
      svgImg.setAttribute('height', imgH);
      svgImg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      svgImg.setAttribute('opacity', '0.9');

      // Auto-fallback if the local image file is missing or blocked by browser CORS
      svgImg.onerror = function() {
        svgImg.setAttribute('href', DEFAULT_EMBEDDED_SPECIMEN);
      };

      if (filterAttr) svgImg.setAttribute('filter', filterAttr);
      artworkLayer.appendChild(svgImg);

      // 4. Monumental Title (Behind vs Fore Relationship)
      behindTitleLayer.innerHTML = '';
      foreTitleLayer.innerHTML = '';

      const h1Elem = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      const h1YPos = 1200 * (parseInt(yH1.value, 10) / 100);
      h1Elem.setAttribute('x', '450');
      h1Elem.setAttribute('y', h1YPos);
      h1Elem.setAttribute('class', 'svg-h1');
      h1Elem.setAttribute('fill', theme.text);
      h1Elem.setAttribute('font-family', fontH1.value);
      h1Elem.setAttribute('font-size', `${sizeH1.value}px`);
      h1Elem.textContent = textH1.value.toUpperCase();

      if (toggleBehind.checked) {
        behindTitleLayer.appendChild(h1Elem);
      } else {
        foreTitleLayer.appendChild(h1Elem);
      }

      // 5. Secondary Architectural Hierarchies & Metadata
      metadataLayer.innerHTML = '';

      // H2 Heading
      const h2Elem = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      h2Elem.setAttribute('x', '450');
      h2Elem.setAttribute('y', '96');
      h2Elem.setAttribute('class', 'svg-h2');
      h2Elem.setAttribute('fill', theme.accent);
      h2Elem.textContent = textH2.value.toUpperCase();
      metadataLayer.appendChild(h2Elem);

      // Event Information Block (Bottom Left Alignment)
      const metaLines = textMeta.value.split('\n');
      const metaTextElem = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      metaTextElem.setAttribute('x', '75');
      metaTextElem.setAttribute('y', '1105');
      metaTextElem.setAttribute('class', 'svg-meta');
      metaTextElem.setAttribute('fill', theme.text);
      metaTextElem.setAttribute('font-family', fontBody.value);

      metaLines.forEach((lineText, idx) => {
        const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
        tspan.setAttribute('x', '75');
        tspan.setAttribute('dy', idx === 0 ? '0' : '18');
        tspan.textContent = lineText.toUpperCase();
        metaTextElem.appendChild(tspan);
      });
      metadataLayer.appendChild(metaTextElem);

      // Astrological & Alchemical Registration Stamp (Bottom Right)
      const coordElem = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      coordElem.setAttribute('x', '825');
      coordElem.setAttribute('y', '1105');
      coordElem.setAttribute('text-anchor', 'end');
      coordElem.setAttribute('class', 'svg-meta');
      coordElem.setAttribute('font-family', fontBody.value);
      coordElem.innerHTML = `
        <tspan x="825" dy="0" fill="${theme.accent}">SEAL: ☉ ☽ ♄ 🜍 🜂</tspan>
        <tspan x="825" dy="18" fill="${theme.text}">ARCHIVE CATALOG № 03041-S2</tspan>
      `;
      metadataLayer.appendChild(coordElem);

      // 6. Framing Borders & Precision Registration Brackets
      frameLayer.innerHTML = '';

      // Outer bounding boundary
      const outerBorder = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      outerBorder.setAttribute('x', '40');
      outerBorder.setAttribute('y', '40');
      outerBorder.setAttribute('width', '820');
      outerBorder.setAttribute('height', '1120');
      outerBorder.setAttribute('fill', 'none');
      outerBorder.setAttribute('stroke', theme.accent);
      outerBorder.setAttribute('class', 'solid-rule');
      frameLayer.appendChild(outerBorder);

      // Inner hairline rule
      const innerBorder = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      innerBorder.setAttribute('x', '48');
      innerBorder.setAttribute('y', '48');
      innerBorder.setAttribute('width', '804');
      innerBorder.setAttribute('height', '1104');
      innerBorder.setAttribute('fill', 'none');
      innerBorder.setAttribute('stroke', theme.text);
      innerBorder.setAttribute('stroke-width', '0.75');
      innerBorder.setAttribute('opacity', '0.35');
      frameLayer.appendChild(innerBorder);

      // Corner Crosshair Registration Marks
      if (toggleBrackets.checked) {
        const corners = [
          {x: 40, y: 40}, {x: 860, y: 40},
          {x: 40, y: 1160}, {x: 860, y: 1160}
        ];
        corners.forEach(pt => {
          const cross = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          cross.innerHTML = `
            <line x1="${pt.x - 12}" y1="${pt.y}" x2="${pt.x + 12}" y2="${pt.y}" stroke="${theme.accent}" stroke-width="1.5"/>
            <line x1="${pt.x}" y1="${pt.y - 12}" x2="${pt.x}" y2="${pt.y + 12}" stroke="${theme.accent}" stroke-width="1.5"/>
            <circle cx="${pt.x}" cy="${pt.y}" r="4" fill="none" stroke="${theme.text}" stroke-width="0.75"/>
          `;
          frameLayer.appendChild(cross);
        });
      }
    }

    /* ==========================================================================
       4. ORCHESTRATION & SERIES MUTATOR
       Produces unified variations while respecting SKILLS.md guardrails
       ========================================================================== */
    btnMutate.addEventListener('click', () => {
      const plates = plateSelect.options;
      plateSelect.selectedIndex = Math.floor(Math.random() * plates.length);
      currentImageBase64 = null;

      const filters = plateFilter.options;
      plateFilter.selectedIndex = Math.floor(Math.random() * filters.length);

      const h1Fonts = ['UnifrakturCook', 'Pirata One', 'Cinzel'];
      fontH1.value = h1Fonts[Math.floor(Math.random() * h1Fonts.length)];

      plateScale.value = Math.floor(Math.random() * 25) + 35;
      sizeH1.value = Math.floor(Math.random() * 45) + 65;
      yH1.value = Math.floor(Math.random() * 40) + 20;

      updateAndRender();
    });

    /* ==========================================================================
       5. PURE-VECTOR SVG EXPORT ENGINE (ILLUSTRATOR COMPATIBLE)
       Serializes the live DOM, attaches namespaces, and triggers clean download
       ========================================================================== */
    btnExportSvg.addEventListener('click', () => {
      const svg = document.getElementById('poster-svg');
      const serializer = new XMLSerializer();
      let source = serializer.serializeToString(svg);

      if (!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
        source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
      }

      source = '<?xml version="1.0" standalone="no"?>\r\n' + source;

      const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const downloadLink = document.createElement('a');
      downloadLink.href = url;
      const cleanTitle = textH1.value.toLowerCase().replace(/[^a-z0-9]/g, '_') || 'poster';
      downloadLink.download = `art3041_specimen_${cleanTitle}.svg`;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
      URL.revokeObjectURL(url);
    });

    window.addEventListener('DOMContentLoaded', () => {
      updateAndRender();
    });
  </script>
</body>
</html>
